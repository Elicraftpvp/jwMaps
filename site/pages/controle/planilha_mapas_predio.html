<!DOCTYPE html>
<html lang="pt-br" class="h-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planilha de Mapas de Prédios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../../style/css.css">
    <style>
        .mapas-dirigente-container {
            min-height: 35px;
            padding: 0px;
            border: 1px dashed #e0e0e0;
            border-radius: 4px;
            transition: all 0.2s;
        }
        
        .mapas-dirigente-container.drag-over {
            background-color: rgba(233, 30, 99, 0.1);
            border-color: #E91E63;
        }

        .mapa-item {
            cursor: grab;
            margin: 2px;
            user-select: none;
            font-weight: 500;
        }
        .mapa-item:active {
            cursor: grabbing;
        }

        #lista-mapas-disponiveis {
            min-height: 100px;
            background-color: #f8f9fa;
        }

        /* Estilo Rosa (Atribuído Prédio) */
        .mapa-predio-badge {
            background-color: #F8BBD0 !important;
            color: #880E4F !important;
            border: 1px solid #f48fb1;
        }

        /* Estilo Verde (Disponível) */
        .mapa-disponivel-badge {
            background-color: #E9F5E7 !important;
            color: #2A6E2C !important;
            border: 1px solid #ccebce;
        }
    </style>
</head>
<body class="iframe-page">

<div class="container-fluid py-3">
    
    <!-- Tabela de Dirigentes -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-white" style="border-top: 5px solid #E91E63;">
            <h5 class="mb-0 fw-bold" style="color: #E91E63;"><i class="fas fa-building me-2"></i>Atribuição de Mapas de Prédios</h5>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table align-middle mb-0 planilla-dirigentes-table">
                    <thead>
                        <tr class="table-secondary">
                            <th style="width: 25%;">Dirigente</th>
                            <th>Mapas (Arraste para atribuir)</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-dirigentes-body">
                        <tr>
                            <td colspan="2" class="p-5 text-center">
                                <div class="spinner-border text-danger" role="status">
                                    <span class="visually-hidden">Carregando...</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Mapas Disponíveis -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-white">
            <h5 class="mb-0 fw-bold text-success"><i class="fas fa-map-marked-alt me-2"></i>Mapas Disponíveis</h5>
        </div>
        <div class="card-body d-flex flex-wrap align-content-start gap-1" id="lista-mapas-disponiveis">
            <div class="w-100 text-center p-3">
                <div class="spinner-border text-success" role="status"></div>
            </div>
        </div>
    </div>
</div>

    <script src="../../script/common.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <script src="../../script/planilha_mapas_predio.js"></script>
    <script src="../../script/planilha_mapas_predio_drag.js"></script>
</body>
</html>
